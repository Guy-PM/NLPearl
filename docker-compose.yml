# Local-only Docker setup for verifying the containers before deployment.
# Staging/production do NOT use compose — the post-receive hook in
# deploy/post-receive.staging runs `docker run --network host` directly on
# the VPS, same pattern as PayMe's other internal tools. See deploy/README.md.

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: nlpearl-backend
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    environment:
      DATABASE_URL: "${DOCKER_DATABASE_URL}"
      PORT: "${PORT:-3001}"
      HOST: "0.0.0.0"
      N8N_WEBHOOK_API_KEY: "${N8N_WEBHOOK_API_KEY}"
      NLPEARL_WEBHOOK_API_KEY: "${NLPEARL_WEBHOOK_API_KEY}"
      NLPEARL_API_BASE_URL: "${NLPEARL_API_BASE_URL:-https://api.nlpearl.ai}"
      NLPEARL_API_KEY: "${NLPEARL_API_KEY}"
      NOTIFICATION_GATEWAY_URL: "${NOTIFICATION_GATEWAY_URL}"
      NOTIFICATION_GATEWAY_API_KEY: "${NOTIFICATION_GATEWAY_API_KEY}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}"
    container_name: nlpearl-frontend
    ports:
      - "3010:3010"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
